<div class="sig-stack">
  <sig-panel
    [title]="vm().descriptor.title"
    [subtitle]="vm().descriptor.subtitle"
    [badge]="vm().engineBadge"
  >
    <div class="sig-toolbar">
      <div class="sig-row">
        @for (erp of vm().erpTargets; track erp) {
          <button
            class="sig-btn"
            [class.sig-btn-primary]="vm().erpTarget === erp"
            type="button"
            (click)="selectErp(erp)"
          >
            {{ erp }}
          </button>
        }
      </div>
      <sig-status-pill [label]="vm().erpSyncBadge" tone="ok" />
    </div>
  </sig-panel>

  <sig-dual-plane-viewport
    [domainTitle]="vm().descriptor.title"
    [hudSignals]="vm().descriptor.hudSignals"
  />

  <sig-multi-bom-passport />
  <sig-change-deviation-ctb-tower />
</div>
