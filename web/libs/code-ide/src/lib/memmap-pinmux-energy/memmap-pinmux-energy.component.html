<sig-panel
  title="CMSIS-SVD / .ld / .dts Memory-Map, MaxSAT Pinmux & Firmware Energy Ledger"
  subtitle="FEAT-054 Disjoint Address Tree • FEAT-055 1-Click SAT Pinmux & HAL • FEAT-056 nJ Flamegraph"
  badge="signal-cosim"
>
  <div class="sig-stack">
    <div class="sig-toolbar">
      <div class="sig-row">
        <button class="sig-btn" [class.sig-btn-primary]="vm().satPinmuxSolved" type="button" (click)="toggleSatPinmux()">
          1-Click MaxSAT Pinmux Auto-Solve
        </button>
        <button class="sig-btn" [class.sig-btn-primary]="vm().deepSleepEnabled" type="button" (click)="toggleDeepSleep()">
          Tickless Deep-Sleep Duty-Cycle
        </button>
      </div>
      <sig-status-pill [label]="vm().summaryBadge" [tone]="vm().summaryTone" />
    </div>

    <div class="sig-surface sig-row-between">
      <span class="sig-code">{{ vm().halSnippetPreview }}</span>
      <span class="sig-badge sig-mono">{{ vm().energyBadge }}</span>
    </div>

    <sig-data-grid [columns]="vm().columns" [rows]="vm().rows" />
  </div>
</sig-panel>
