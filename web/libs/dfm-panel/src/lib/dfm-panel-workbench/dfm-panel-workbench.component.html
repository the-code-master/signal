<div class="sig-stack">
  <sig-panel
    [title]="vm().descriptor.title"
    [subtitle]="vm().descriptor.subtitle"
    [badge]="vm().engineBadge"
  >
    <div class="sig-toolbar">
      <div class="sig-row">
        @for (vol of vm().volumeTiers; track vol) {
          <button
            class="sig-btn"
            [class.sig-btn-primary]="vm().volumeTier === vol"
            type="button"
            (click)="selectVolume(vol)"
          >
            {{ vol }}
          </button>
        }
      </div>
      <sig-status-pill [label]="vm().costYieldBadge" [tone]="vm().costYieldTone" />
    </div>
  </sig-panel>

  <sig-dual-plane-viewport
    [domainTitle]="vm().descriptor.title"
    [hudSignals]="vm().descriptor.hudSignals"
  />

  <sig-panel-dfa-fatigue-coating />
  <sig-drawing-ict-msl />
</div>
