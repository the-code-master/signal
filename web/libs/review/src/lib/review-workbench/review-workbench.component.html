<div class="sig-stack">
  <sig-panel
    [title]="vm().descriptor.title"
    [subtitle]="vm().descriptor.subtitle"
    [badge]="vm().engineBadge"
  >
    <div class="sig-toolbar">
      <sig-status-pill [label]="vm().openThreadBadge" tone="ok" />
      <button class="sig-btn sig-btn-primary" type="button" (click)="toggleResolveThreads()">
        Resolve / Reopen Spatial Thread Blockers
      </button>
    </div>
  </sig-panel>

  <sig-live-huddle-presence />

  <sig-dual-plane-viewport
    [domainTitle]="vm().descriptor.title"
    [hudSignals]="vm().descriptor.hudSignals"
  />

  <sig-panel title="Spatial Canvas-Anchored Review Threads (F-074)" badge="BigInt nm Anchors">
    <sig-data-grid [columns]="vm().threadColumns" [rows]="vm().threadRows" />
  </sig-panel>

  <sig-stage-gate-checklist />
  <sig-principal-audit />
  <sig-live-review-deck />
  <sig-external-partner-portal />
</div>
