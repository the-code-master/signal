<sig-panel
  title="Live Huddle Follow-Me & 60 Hz Laser Pointer"
  subtitle="FEAT-094 Ephemeral Camera Lock & Viewport Reticle Stream"
  badge="ephemeral_presence"
>
  <div class="sig-stack">
    <div class="sig-toolbar">
      <sig-status-pill [label]="vm().followBadge" tone="ok" />
      <button class="sig-btn sig-btn-primary" type="button" (click)="toggleLaser()">
        {{ vm().laserBadge }}
      </button>
    </div>

    <div class="sig-row">
      @for (peer of vm().peers; track peer.sessionId) {
        <button
          class="sig-btn"
          [class.sig-btn-primary]="vm().followedLeader?.sessionId === peer.sessionId"
          type="button"
          (click)="toggleFollow(peer.sessionId)"
        >
          Follow {{ peer.displayHandle }} ({{ peer.activeDomain }})
        </button>
      }
    </div>
  </div>
</sig-panel>
