<sig-panel
  title="Pin/Gate Swap, Spatial Reannotate & Parametric Equations"
  subtitle="FEAT-008 Bipartite Swap • FEAT-009 Spatial RefDes • FEAT-010 Equation Solver"
  badge="signal-core"
>
  <div class="sig-stack">
    <div class="sig-toolbar">
      <sig-status-pill [label]="vm().swapSavingsBadge" tone="ok" />
      <button class="sig-btn sig-btn-primary" type="button" (click)="toggleAcceptSwaps()">
        Accept / Preview Equivalent Pin Swaps
      </button>
    </div>

    <sig-data-grid [columns]="vm().swapColumns" [rows]="vm().swapRows" />

    <div class="sig-toolbar">
      <span class="sig-subtitle">Spatial Reannotate Sweep:</span>
      <div class="sig-row">
        @for (dir of sweepDirections; track dir) {
          <button
            class="sig-btn"
            [class.sig-btn-primary]="sweepDirection() === dir"
            type="button"
            (click)="selectSweep(dir)"
          >
            {{ dir }}
          </button>
        }
      </div>
    </div>

    <sig-data-grid [columns]="vm().reannotateColumns" [rows]="vm().reannotateRows" />

    <div class="sig-toolbar">
      <div class="sig-row">
        <label class="sig-subtitle" for="sig-eq-expr">Parametric Equation:</label>
        <input
          id="sig-eq-expr"
          class="sig-input"
          type="text"
          [value]="equationExpr()"
          (input)="onEquationInput($event)"
        />
      </div>
      <sig-status-pill [label]="vm().equationResult.summaryText" [tone]="vm().equationResult.tone" />
    </div>
  </div>
</sig-panel>
