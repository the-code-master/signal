<div class="sig-stack">
  <sig-panel
    [title]="vm().descriptor.title"
    [subtitle]="vm().descriptor.subtitle"
    [badge]="vm().engineBadge"
  >
    <div class="sig-stack">
      <div class="sig-grid-cards">
        @for (kpi of vm().descriptor.kpis; track kpi.id) {
          <div class="sig-panel sig-row-between">
            <span class="sig-subtitle">{{ kpi.label }}</span>
            <sig-status-pill [label]="kpi.value" [tone]="kpi.tone" />
          </div>
        }
      </div>
      <div class="sig-toolbar">
        <div class="sig-row">
          @for (tab of vm().tabs; track tab.id) {
            <button
              class="sig-btn"
              [class.sig-btn-primary]="vm().activeTab === tab.id"
              type="button"
              (click)="selectTab(tab.id)"
            >
              {{ tab.label }}
            </button>
          }
        </div>
        <span class="sig-code">{{ vm().statusBanner }}</span>
      </div>
    </div>
  </sig-panel>

  <sig-dual-plane-viewport
    [domainTitle]="vm().descriptor.title"
    [hudSignals]="vm().descriptor.hudSignals"
  />

  @switch (vm().activeTab) {
    @case ("BEAUTIFY_BUS") {
      <sig-beautify-bus (beautifyApplied)="onBeautifyApplied($event)" />
    }
    @case ("LIVE_HUD") {
      <sig-live-sim-hud />
    }
    @case ("HIERARCHY_VARIANTS") {
      <sig-hierarchy-variants (portalNavigated)="onPortalNavigated($event)" />
    }
    @case ("PINSWAP_EQUATIONS") {
      <sig-pinswap-equations />
    }
  }
</div>
