<sig-panel
  title="SerDes Jitter & PAM4 Bathtub Studio"
  subtitle="FEAT-084 Dual-Dirac RJ/DJ/PJ/DDJ (fs) • 1e-15 BER Eye Opening"
  badge="jitter_ber"
>
  <div class="sig-stack">
    <div class="sig-toolbar">
      <sig-status-pill [label]="vm().eyeBadge" [tone]="vm().eyeTone" />
      <div class="sig-row">
        @for (preset of presets; track preset) {
          <button
            class="sig-btn"
            [class.sig-btn-primary]="vm().ratePreset === preset"
            type="button"
            (click)="selectPreset(preset)"
          >
            {{ preset }}
          </button>
        }
      </div>
    </div>

    <div class="sig-row">
      @for (badge of vm().breakdownBadges; track badge) {
        <span class="sig-badge sig-mono">{{ badge }}</span>
      }
    </div>

    <sig-data-grid [columns]="vm().eyeColumns" [rows]="vm().eyeRows" />
  </div>
</sig-panel>
