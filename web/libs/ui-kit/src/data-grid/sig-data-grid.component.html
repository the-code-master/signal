<table class="sig-table">
  <thead>
    <tr>
      @for (col of columns(); track col.key) {
        <th>{{ col.header }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of visibleRows(); track row[trackKey()]) {
      <tr>
        @for (col of columns(); track col.key) {
          <td [class.sig-mono]="col.mono">{{ row[col.key] }}</td>
        }
      </tr>
    }
  </tbody>
</table>
