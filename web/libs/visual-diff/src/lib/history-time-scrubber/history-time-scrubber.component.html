<sig-panel
  title="Super-Commit History Time Scrubber"
  subtitle="FEAT-097 Commit-Graph Delta Walker • Onion-Skin Alpha Blend"
  badge="signal-git-sync"
>
  <div class="sig-stack">
    <div class="sig-toolbar">
      <sig-status-pill [label]="vm().scrubberBadge" tone="ok" />
      <span class="sig-code">{{ vm().selectedCheckpoint.summary }} ({{ vm().selectedCheckpoint.deltaEntityCount }} ops)</span>
    </div>

    <div class="sig-toolbar">
      <div class="sig-row">
        <label class="sig-subtitle" for="sig-hist-rev">Timeline Checkpoint:</label>
        <input id="sig-hist-rev" type="range" min="0" max="2" [value]="checkpointIdx()" (input)="onScrubIdx($event)" />
      </div>
      <div class="sig-row">
        <label class="sig-subtitle" for="sig-onion-alpha">Onion-Skin Alpha:</label>
        <input id="sig-onion-alpha" type="range" min="0" max="100" [value]="onionOpacity()" (input)="onOpacityInput($event)" />
      </div>
    </div>
  </div>
</sig-panel>
