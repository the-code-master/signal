# Module: engine/deny.toml — Supply-Chain License, Advisory, Ban & Source Gate
# Invariants: Rejects copyleft contamination, known RustSec CVEs, wildcard versions, and unknown registries (F-091).
# Spec: architecture/15-application-security-and-project-isolation.md, docs/engineering/RUST_ENGINEERING_GUIDE.md
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "LicenseRef-Signal-Proprietary",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys", reason = "Signal mandates pure-Rust TLS/crypto + PQC (no ambient OpenSSL C bindings)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
