# Module: engine/Cargo.toml — Pure-Rust 1.100+ (2024 Edition) Monorepo Workspace
# Invariants: #![forbid(unsafe_code)] workspace-wide; acyclic crate DAG; single signal-proto codegen (F-143).
# Spec: architecture/03-rust-eda-engine.md, docs/engineering/RUST_ENGINEERING_GUIDE.md
[workspace]
resolver = "3"
members = [
    "crates/workspace-hack",
    "crates/signal-proto",
    "crates/signal-core",
    "crates/signal-geom",
    "crates/signal-graph",
    "crates/signal-component",
    "crates/signal-lib-passive",
    "crates/signal-lib-semiconductor",
    "crates/signal-module-sdk",
    "crates/signal-parts",
    "crates/signal-sim",
    "crates/signal-diff-sim",
    "crates/signal-git-sync",
    "crates/signal-cell-wasm",
    "crates/signal-pod",
    "crates/signal-operator",
    "crates/signal-egress-proxy",
    "crates/signal-sftp-egress",
    "crates/signal-mcad",
    "crates/signal-cam",
    "crates/signal-plm",
    "crates/signal-formal",
    "crates/signal-surrogate",
    "crates/signal-import",
    "crates/signal-pcb",
    "crates/signal-em3d",
    "crates/signal-magnetics",
    "crates/signal-power-integrity",
    "crates/signal-emc",
    "crates/signal-aging",
    "crates/signal-dfm",
    "crates/signal-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Signal-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
workspace-hack = { path = "crates/workspace-hack" }
signal-proto = { path = "crates/signal-proto" }
signal-core = { path = "crates/signal-core" }
signal-geom = { path = "crates/signal-geom" }
signal-graph = { path = "crates/signal-graph" }
signal-component = { path = "crates/signal-component" }
signal-lib-passive = { path = "crates/signal-lib-passive" }
signal-lib-semiconductor = { path = "crates/signal-lib-semiconductor" }
signal-module-sdk = { path = "crates/signal-module-sdk" }
signal-parts = { path = "crates/signal-parts" }
signal-sim = { path = "crates/signal-sim" }
signal-git-sync = { path = "crates/signal-git-sync" }
signal-formal = { path = "crates/signal-formal" }
signal-aging = { path = "crates/signal-aging" }
signal-egress-proxy = { path = "crates/signal-egress-proxy" }
prost = "0.13"
prost-build = "0.13"
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen", "transport"] }
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
