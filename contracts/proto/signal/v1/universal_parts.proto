// Module: 3-Tier Universal Component, Master Pin Table, IEEE/IEC Symbol, Padstack & 3D STEP Contract
// Invariants: Never leaks Org NDA AVL overlays into Global CAS; enforces 3-way pin/pad/STEP bijection.
// Spec: architecture/18-universal-component-and-datasheet-repository.md

syntax = "proto3";

package signal.v1;

import "signal/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.signaldesign.v1";

enum SymbolStandard {
  SYMBOL_STANDARD_UNSPECIFIED = 0;
  SYMBOL_STANDARD_IEEE_315 = 1;
  SYMBOL_STANDARD_IEC_60617 = 2;
}

enum PadShapeKind {
  PAD_SHAPE_KIND_UNSPECIFIED = 0;
  PAD_SHAPE_KIND_CIRCLE = 1;
  PAD_SHAPE_KIND_ROUNDRECT = 2;
  PAD_SHAPE_KIND_OBLONG = 3;
  PAD_SHAPE_KIND_POLYGON = 4;
}

message MasterPinRecord {
  string pin_number = 1;
  string canonical_signal_name = 2;
  uint32 symbol_unit_index = 3;
  string pad_designator = 4;
  uint32 spice_port_id = 5;
  Point3dNm step_lead_centroid_nm = 6;
}

message PadstackDef {
  string padstack_id = 1;
  PadShapeKind shape = 2;
  int64 copper_width_nm = 3 [jstype = JS_STRING];
  int64 copper_height_nm = 4 [jstype = JS_STRING];
  int64 drill_diameter_nm = 5 [jstype = JS_STRING];
  int64 solder_mask_expansion_nm = 6 [jstype = JS_STRING];
  int64 paste_mask_contraction_nm = 7 [jstype = JS_STRING];
  bool requires_backdrill = 8;
}

message UniversalComponentRevision {
  string upid = 1;
  string revision_hash_blake3 = 2;
  string orderable_mpn = 3;
  string manufacturer = 4;
  VerificationBadge badge = 5;
  SymbolStandard preferred_symbol = 6;
  BoundingBox3dNm courtyard_3d_nm = 7;
  repeated MasterPinRecord master_pins = 8;
  repeated PadstackDef padstacks = 9;
  bool org_private_nda_taint = 10;
}

message ResolveUniversalPartRequest {
  string org_id = 1;
  string project_id = 2;
  string upid = 3;
  string pinned_blake3_hash = 4;
}

message ResolveUniversalPartResponse {
  UniversalComponentRevision part = 1;
  bool resolved_from_org_avl_overlay = 2;
  double step_lead_pad_overlap_ratio = 3;
}

message VerifyThreeWayStepPadAlignmentRequest {
  string upid = 1;
  string revision_hash_blake3 = 2;
}

message VerifyThreeWayStepPadAlignmentResponse {
  bool bijection_valid = 1;
  double min_lead_pad_overlap_ratio = 2;
  int64 max_centroid_offset_nm = 3 [jstype = JS_STRING];
  VerificationBadge awarded_badge = 4;
}

service UniversalPartsService {
  rpc ResolveUniversalPart(ResolveUniversalPartRequest) returns (ResolveUniversalPartResponse);
  rpc VerifyThreeWayStepPadAlignment(VerifyThreeWayStepPadAlignmentRequest) returns (VerifyThreeWayStepPadAlignmentResponse);
}
