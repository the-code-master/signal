// Module: Zero-Leak 5-Team Collaboration Space, Project Status Control Tower & Automated Reviews (21-*)
// Invariants: Enforces per-repo required_repo_scopes RBAC masking and 100% deterministic KPI review generation.
// Spec: architecture/21-collaboration-space-project-status-and-automated-reviews.md, architecture/17-extended-feature-specifications-ui-and-rust.md

syntax = "proto3";

package signal.v1;

import "signal/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.signaldesign.v1";

enum TeamWorkspaceKind {
  TEAM_WORKSPACE_KIND_UNSPECIFIED = 0;
  TEAM_WORKSPACE_KIND_DESIGN = 1;
  TEAM_WORKSPACE_KIND_DEVELOPMENT_BRINGUP = 2;
  TEAM_WORKSPACE_KIND_SOFTWARE_FIRMWARE = 3;
  TEAM_WORKSPACE_KIND_MANUFACTURING = 4;
  TEAM_WORKSPACE_KIND_OPERATIONS_SUPPLY_CHAIN = 5;
  TEAM_WORKSPACE_KIND_CROSS_TEAM_PROGRAM = 6;
}

enum RagHealthStatus {
  RAG_HEALTH_STATUS_UNSPECIFIED = 0;
  RAG_HEALTH_STATUS_GREEN = 1;
  RAG_HEALTH_STATUS_AMBER = 2;
  RAG_HEALTH_STATUS_RED = 3;
}

enum PeriodicReviewCadence {
  PERIODIC_REVIEW_CADENCE_UNSPECIFIED = 0;
  PERIODIC_REVIEW_CADENCE_WEEKLY_ENGINEERING = 1;
  PERIODIC_REVIEW_CADENCE_MONTHLY_EXECUTIVE = 2;
  PERIODIC_REVIEW_CADENCE_STAGE_GATE_STATUS = 3;
}

message EntityAnchorRef {
  SubprojectDomain domain = 1;
  string entity_id = 2;
  string commit_sha = 3;
  Point3dNm location_nm = 4;
  string required_provider_repo_id = 5;
}

message StageGateMilestone {
  string gate_id = 1;
  string gate_name = 2;
  int64 target_date_utc_ms = 3 [jstype = JS_STRING];
  RagHealthStatus health = 4;
  uint32 open_blocker_count = 5;
}

message CrossTeamDependency {
  string dependency_id = 1;
  TeamWorkspaceKind producer_team = 2;
  TeamWorkspaceKind consumer_team = 3;
  string deliverable_title = 4;
  int64 due_at_utc_ms = 5 [jstype = JS_STRING];
  string handshake_status = 6;
}

message ActionItem {
  string action_id = 1;
  string owner_pseudo_id = 2;
  TeamWorkspaceKind team = 3;
  string summary = 4;
  int64 due_at_utc_ms = 5 [jstype = JS_STRING];
  bool completed = 6;
}

message DecisionRecord {
  string decision_id = 1;
  string record_kind = 2;
  string title = 3;
  string rationale = 4;
  int64 decided_at_utc_ms = 5 [jstype = JS_STRING];
  HybridPqcSignature lead_signature = 6;
}

message PostAnchoredMessageRequest {
  string org_id = 1;
  string project_id = 2;
  string channel_id = 3;
  TeamWorkspaceKind team = 4;
  string ciphertext_body_b64 = 5;
  repeated EntityAnchorRef entity_anchors = 6;
}

message PostAnchoredMessageResponse {
  string message_id = 1;
  int64 created_at_utc_ms = 2 [jstype = JS_STRING];
  uint32 redacted_anchor_count = 3;
}

message IssueHuddleTicketRequest {
  string org_id = 1;
  string project_id = 2;
  string channel_id = 3;
  string actor_pseudo_id = 4;
}

message IssueHuddleTicketResponse {
  string huddle_room_id = 1;
  string sfu_turns_endpoint = 2;
  string ed25519_huddle_ticket = 3;
  int64 expires_at_utc_ms = 4 [jstype = JS_STRING];
}

message GetProjectStatusTowerRequest {
  string org_id = 1;
  string project_id = 2;
}

message GetProjectStatusTowerResponse {
  RagHealthStatus overall_health = 1;
  repeated StageGateMilestone milestones = 2;
  repeated CrossTeamDependency dependencies = 3;
  repeated ActionItem action_items = 4;
  repeated DecisionRecord decisions = 5;
}

message ExportEntityReviewSnapshotRequest {
  string project_id = 1;
  repeated string anchor_entity_ids = 2;
}

message ExportEntityReviewSnapshotResponse {
  uint32 drc_erc_lvs_violations = 1;
  double worst_spice_soa_margin_pct = 2;
  int64 worst_sta_slack_fs = 3 [jstype = JS_STRING];
  uint32 mcad_collision_count = 4;
}

message GeneratePeriodicReviewRequest {
  string org_id = 1;
  string project_id = 2;
  PeriodicReviewCadence cadence = 3;
  int64 window_start_utc_ms = 4 [jstype = JS_STRING];
  int64 window_end_utc_ms = 5 [jstype = JS_STRING];
  string stage_gate_name = 6;
}

message GeneratePeriodicReviewResponse {
  string review_id = 1;
  PeriodicReviewCadence cadence = 2;
  RagHealthStatus overall_health = 3;
  uint32 open_drc_erc_violations = 4;
  uint32 clear_to_build_units = 5;
  string archived_ops_repo_path = 6;
  HybridPqcSignature review_signature = 7;
  string gbnf_verified_narrative_md = 8;
}

message SignOffStageGateReviewRequest {
  string org_id = 1;
  string project_id = 2;
  string review_id = 3;
  string burned_stepup_2fa_nonce = 4;
  uint64 quorum_audit_outbox_seq = 5 [jstype = JS_STRING];
  HybridPqcSignature approver_signature = 6;
}

message SignOffStageGateReviewResponse {
  bool gate_approved = 1;
  string ops_repo_commit_sha = 2;
  int64 signed_at_utc_ms = 3 [jstype = JS_STRING];
}

service CollabChannelService {
  rpc PostAnchoredMessage(PostAnchoredMessageRequest) returns (PostAnchoredMessageResponse);
  rpc IssueHuddleTicket(IssueHuddleTicketRequest) returns (IssueHuddleTicketResponse);
}

service ProjectStatusService {
  rpc GetProjectStatusTower(GetProjectStatusTowerRequest) returns (GetProjectStatusTowerResponse);
  rpc ExportEntityReviewSnapshot(ExportEntityReviewSnapshotRequest) returns (ExportEntityReviewSnapshotResponse);
}

service AutomatedReviewService {
  rpc GeneratePeriodicReview(GeneratePeriodicReviewRequest) returns (GeneratePeriodicReviewResponse);
  rpc SignOffStageGateReview(SignOffStageGateReviewRequest) returns (SignOffStageGateReviewResponse);
}
