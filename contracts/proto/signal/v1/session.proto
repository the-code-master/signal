// Module: Sticky Project Cell Hydration, Host-Aggregated Leases, WASM Promotion & Collab Presence
// Invariants: Enforces N-2 wire handshake, Host-Aggregated Lease fencing, < 150 ms migration, and H100 CC vs B200 MIG.
// Spec: architecture/04-kubernetes-runtime-and-collaboration.md, architecture/17-extended-feature-specifications-ui-and-rust.md

syntax = "proto3";

package signal.v1;

import "signal/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.signaldesign.v1";

enum CellComputeTier {
  CELL_COMPUTE_TIER_UNSPECIFIED = 0;
  CELL_COMPUTE_TIER_EXPLORER_WASM = 1;
  CELL_COMPUTE_TIER_CORE_STANDARD = 2;
  CELL_COMPUTE_TIER_CORE_HIGHMEM = 3;
  CELL_COMPUTE_TIER_CORE_GPU = 4;
  CELL_COMPUTE_TIER_CONFIDENTIAL_SILICON = 5;
}

enum ConfidentialGpuMode {
  CONFIDENTIAL_GPU_MODE_UNSPECIFIED = 0;
  CONFIDENTIAL_GPU_MODE_NONE = 1;
  CONFIDENTIAL_GPU_MODE_H100_FULL_CC_EXCLUSIVE = 2;
  CONFIDENTIAL_GPU_MODE_B200_TEE_IO_CONFIDENTIAL_MIG = 3;
}

enum VideoStreamCodec {
  VIDEO_STREAM_CODEC_UNSPECIFIED = 0;
  VIDEO_STREAM_CODEC_ZSTD_QOI_TILES_ONLY = 1;
  VIDEO_STREAM_CODEC_HEVC_444_HW = 2;
  VIDEO_STREAM_CODEC_AV1_DUAL_LUMA = 3;
  VIDEO_STREAM_CODEC_H264_DUAL_LUMA = 4;
}

enum SessionLifecycleState {
  SESSION_LIFECYCLE_STATE_UNSPECIFIED = 0;
  SESSION_LIFECYCLE_STATE_BOOTING = 1;
  SESSION_LIFECYCLE_STATE_MOUNTED = 2;
  SESSION_LIFECYCLE_STATE_MIGRATING = 3;
  SESSION_LIFECYCLE_STATE_HIBERNATING = 4;
}

message HydrateProjectRequest {
  FencingAuthority fencing = 1;
  ProjectVaultMode vault_mode = 2;
  CellComputeTier compute_tier = 3;
  repeated string authorized_provider_repo_ids = 4;
  string kms_wrapped_dek_key_id = 5;
  string pinned_engine_version = 6;
  ConfidentialGpuMode confidential_gpu_mode = 7;
}

message HydrateProjectResponse {
  SessionLifecycleState state = 1;
  uint64 active_fencing_epoch = 2 [jstype = JS_STRING];
  string mounted_super_commit_id = 3;
  int64 hydration_duration_ps = 4 [jstype = JS_STRING];
  string engine_version = 5;
}

message AttachCollaboratorRequest {
  string project_id = 1;
  string actor_pseudo_id = 2;
  string client_web_version = 3;
  ProgressiveUiProfile ui_profile = 4;
  repeated VideoStreamCodec supported_hw_codecs = 5;
  repeated string verified_provider_repo_ids = 6;
  bool zero_leak_dlp_enforced = 7;
}

message AttachCollaboratorResponse {
  string collaborator_session_id = 1;
  VideoStreamCodec negotiated_codec = 2;
  uint64 current_graph_revision = 3 [jstype = JS_STRING];
  uint64 active_fencing_epoch = 4 [jstype = JS_STRING];
  int64 ticket_expires_at_utc_ms = 5 [jstype = JS_STRING];
}

message EvictCollaboratorRequest {
  string project_id = 1;
  string collaborator_session_id = 2;
  string reason_code = 3;
}

message EvictCollaboratorResponse {
  bool evicted = 1;
  int64 evicted_at_utc_ms = 2 [jstype = JS_STRING];
}

message ThreePhaseLiveMigrateRequest {
  FencingAuthority next_fencing = 1;
  string destination_node_id = 2;
  int64 max_cutover_freeze_ps = 3 [jstype = JS_STRING];
}

message ThreePhaseLiveMigrateResponse {
  bool completed = 1;
  int64 observed_cutover_freeze_ps = 2 [jstype = JS_STRING];
  uint64 new_fencing_epoch = 3 [jstype = JS_STRING];
}

message PromoteWasmCellRequest {
  FencingAuthority next_fencing = 1;
  string wasm_isolate_id = 2;
  CellComputeTier target_tier = 3;
}

message PromoteWasmCellResponse {
  bool promoted = 1;
  string dedicated_pod_id = 2;
  int64 promotion_duration_ps = 3 [jstype = JS_STRING];
}

message BroadcastFollowPresenceRequest {
  string project_id = 1;
  string presenter_session_id = 2;
  Point2dNm camera_center_nm = 3;
  double zoom_scale = 4;
  Point2dNm laser_pointer_nm = 5;
  bool follow_me_locked = 6;
}

message BroadcastFollowPresenceResponse {
  uint32 follower_count = 1;
}

message BreadboardStripMapping {
  string strip_id = 1;
  string net_name = 2;
  repeated uint32 occupied_hole_indices = 3;
}

message SyncBreadboardTwinRequest {
  string project_id = 1;
  string branch_id = 2;
  repeated BreadboardStripMapping strips = 3;
}

message SyncBreadboardTwinResponse {
  bool short_circuit_detected = 1;
  uint64 synced_revision = 2 [jstype = JS_STRING];
}

message IssuePartnerReadonlyViewRequest {
  string project_id = 1;
  string partner_actor_pseudo_id = 2;
  int64 expires_at_utc_ms = 3 [jstype = JS_STRING];
  repeated string allowed_sheet_ids = 4;
}

message IssuePartnerReadonlyViewResponse {
  string partner_ticket_id = 1;
  bool internal_cost_and_notes_stripped = 2;
}

message HibernateAndZeroizeRequest {
  FencingAuthority fencing = 1;
  bool flush_super_commit_first = 2;
}

message HibernateAndZeroizeResponse {
  bool ram_dek_zeroized = 1;
  string final_super_commit_id = 2;
}

service ProjectSessionService {
  rpc HydrateProject(HydrateProjectRequest) returns (HydrateProjectResponse);
  rpc AttachCollaborator(AttachCollaboratorRequest) returns (AttachCollaboratorResponse);
  rpc EvictCollaborator(EvictCollaboratorRequest) returns (EvictCollaboratorResponse);
  rpc ThreePhaseLiveMigrate(ThreePhaseLiveMigrateRequest) returns (ThreePhaseLiveMigrateResponse);
  rpc PromoteWasmCell(PromoteWasmCellRequest) returns (PromoteWasmCellResponse);
  rpc BroadcastFollowPresence(BroadcastFollowPresenceRequest) returns (BroadcastFollowPresenceResponse);
  rpc SyncBreadboardTwin(SyncBreadboardTwinRequest) returns (SyncBreadboardTwinResponse);
  rpc IssuePartnerReadonlyView(IssuePartnerReadonlyViewRequest) returns (IssuePartnerReadonlyViewResponse);
  rpc HibernateAndZeroize(HibernateAndZeroizeRequest) returns (HibernateAndZeroizeResponse);
}
